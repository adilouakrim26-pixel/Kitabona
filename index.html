<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="app-ver" content="3.6-c9">
<meta name="theme-color" content="#ffe3ee">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>كتابنا ♡</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#fff0f6;--card:#fff;--line:#ffc2d9;--ink:#5a2a41;--soft:#a5607f;--pink:#ff5c9a;--sun:#fff4c2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:linear-gradient(#ffe3ee,var(--bg) 220px);color:var(--ink);font-family:"Segoe UI",Tahoma,system-ui,sans-serif;font-size:17px;line-height:1.6;padding-bottom:110px}
.scr{display:none;max-width:560px;margin:0 auto;padding:18px 16px}
.scr.on{display:block}
.deco{text-align:center;font-size:26px;letter-spacing:8px;margin:4px 0}
h1{font-size:30px;margin:6px 0 2px;text-align:center}
h2{font-size:22px;margin:4px 0 10px}
.sub{text-align:center;color:var(--soft);margin:0 0 14px}
.card{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:14px 16px;margin:12px 0}
.card.sun{background:var(--sun);border-color:#f5d86a}
.card b.t{display:block;margin-bottom:6px}
textarea,input[type=text],input[type=email],input[type=password]{width:100%;font:inherit;color:var(--ink);background:#fff8fb;border:2px solid var(--line);border-radius:16px;padding:12px;direction:rtl}
textarea{min-height:130px;resize:vertical}
button{font:inherit;cursor:pointer;border:0;border-radius:999px;padding:10px 18px;background:var(--pink);color:#fff;font-weight:600}
button.ghost{background:#ffe3ee;color:var(--ink)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.st{color:var(--soft);font-size:14px}
.top{display:flex;justify-content:space-between;align-items:center;padding-top:env(safe-area-inset-top,0)}
.top button{background:#fff;border:2px solid var(--line);color:var(--ink);font-size:22px;padding:6px 12px}
.item{display:flex;gap:12px;align-items:center;cursor:pointer}
.dot{flex:none;width:46px;height:46px;border-radius:50%;background:#ffe3ee;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700}
.item.today .dot{background:var(--pink);color:#fff;border-color:var(--pink)}
.item .d{color:var(--soft);font-size:14px}
.nav{position:fixed;inset:auto 12px calc(12px + env(safe-area-inset-bottom,0)) 12px;max-width:540px;margin:0 auto;background:#fff;border:2px solid var(--line);border-radius:999px;display:flex;justify-content:space-around;padding:6px;box-shadow:0 6px 18px #ff5c9a33;z-index:5}
.nav button{background:none;color:var(--soft);border-radius:999px;padding:6px 7px;font-size:11.5px;line-height:1.3;font-weight:500}
.nav button span{display:block;font-size:22px}
.nav button.on{background:#ffe3ee;color:var(--pink);font-weight:700}
.nav button{position:relative}
.nav .rd{position:absolute;top:2px;inset-inline-end:10px;width:12px;height:12px;border-radius:50%;background:#ff2d55;border:2px solid #fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid div{position:relative}
.grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:18px;border:2px solid var(--line)}
.grid .x{position:absolute;top:6px;left:6px;padding:2px 8px;background:#fffc;color:var(--ink)}
audio{width:100%;margin-top:8px}
.ov{position:fixed;inset:0;background:var(--bg);z-index:10;display:none;flex-direction:column}
.ov.on{display:flex}
.ov .bar{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top,0))}
#ml{flex:1;overflow:auto;padding:0 14px;display:flex;flex-direction:column;gap:8px}
.b{max-width:80%;padding:8px 14px;border-radius:20px;background:#fff;border:2px solid var(--line);white-space:pre-wrap}
.b.me{align-self:flex-start;background:#ffd3e4}
.b.ot{align-self:flex-end}
#mf{display:flex;gap:8px;padding:10px 12px calc(12px + env(safe-area-inset-bottom,0))}
.err{color:#c0204f;font-size:14px;min-height:20px}
.cnt{text-align:center;padding:10px 14px;margin-top:4px}
.cnt b{font-size:18px}
.pic{width:100%;border-radius:18px;border:2px solid var(--line);margin-top:8px;display:block}
.cd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:4px 0}
.mini{padding:4px 10px;font-size:14px}
input[type=date]{font:inherit;color:var(--ink);background:#fff8fb;border:2px solid var(--line);border-radius:16px;padding:10px;direction:ltr}

.pinov{position:fixed;inset:0;z-index:300;background:radial-gradient(circle at 50% 25%,#ffe3ee,#ffc2d9);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(8px,2vh,22px);padding:10px;overflow:auto;text-align:center;transition:opacity .65s ease}
.pinov[hidden]{display:none}
.pinov.out{opacity:0;pointer-events:none}
.stage{perspective:1100px;flex:none}
.book{--bh:min(38vh,340px);position:relative;height:var(--bh);aspect-ratio:3/4;transform-style:preserve-3d;transition:transform 1.1s ease;filter:drop-shadow(0 12px 20px #ff5c9a55)}
.pinov.open .book{transform:translateX(-14%)}
.book .pg{position:absolute;inset:0;background:#fffafc;border:2px solid var(--line);border-radius:6px 18px 18px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:10px}
.book .pg .big{font-size:calc(var(--bh)*.115);font-weight:800;color:var(--pink);line-height:1.2}
.book .pg .dt{color:var(--soft);font-size:calc(var(--bh)*.052)}
.book .pg .ln{font-size:calc(var(--bh)*.048);margin-top:6px}
.book .pg .fl{font-size:calc(var(--bh)*.08)}
.lid{position:absolute;inset:0;transform-origin:right center;transform-style:preserve-3d;transition:transform 1.1s cubic-bezier(.5,0,.2,1)}
.pinov.open .lid{transform:rotateY(160deg)}
.face{position:absolute;inset:0;border-radius:6px 18px 18px 6px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--bh)*.02)}
.fr{background:linear-gradient(145deg,#ff7fb0,#ff5c9a);border:3px solid #ff3d86;color:#fff;box-shadow:inset -10px 0 0 #e8508c}
.fr .f{font-size:calc(var(--bh)*.07);letter-spacing:5px}
.fr .t{font-size:calc(var(--bh)*.105);font-weight:800}
.fr .h{font-size:calc(var(--bh)*.045);opacity:.9}
.bk{background:#ffd9e8;border:3px solid #ff9cc2;transform:rotateY(180deg);color:var(--soft);font-size:calc(var(--bh)*.14)}
.hl{width:calc(var(--bh)*.46);height:auto;overflow:visible;margin-top:calc(var(--bh)*.01)}
.hl .shackle{transition:transform .55s cubic-bezier(.3,1.4,.5,1);transform-origin:32px 52px}
.pd{fill:none;stroke:#7a4a0f;stroke-width:1.8;transition:fill .08s}
.pd.f{fill:#7a4a0f}
.pinov.unl .shackle{transform:translate(-2px,-8px) rotate(-30deg)}
.pinov.unl .hl{animation:pop .5s}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.14)}100%{transform:scale(1)}}
.hl.shake{animation:shk .35s}
@keyframes shk{20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.ctrl{display:flex;flex-direction:column;align-items:center;gap:4px;transition:opacity .35s}
.pinov.unl .ctrl{opacity:0;pointer-events:none}
.ctrl h2{margin:0;font-size:clamp(18px,3.2vh,24px)}
.ctrl .sub{margin:0;font-size:clamp(13px,2.2vh,16px)}
.ctrl .err{color:#c2185b;min-height:20px;font-size:14px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(5px,1.3vh,12px);width:min(290px,78vw);direction:ltr}
.pad button{height:clamp(40px,7.4vh,62px);border-radius:999px;background:#fff;border:2px solid var(--line);color:var(--ink);font-size:clamp(20px,3.4vh,26px);font-weight:700;padding:0}
.pad button:active{background:#ffe3ee}
.pad button:disabled{opacity:.4}
.pad .nb{visibility:hidden}
.ctrl .lnk{background:none;color:var(--soft);font-size:14px;text-decoration:underline;font-weight:500;padding:2px 8px}
@media (min-aspect-ratio:5/4){.pinov{flex-direction:row;gap:6vw}.book{--bh:min(76vh,430px)}.pad button{height:clamp(40px,10vh,62px)}}
@media (prefers-reduced-motion:reduce){.book,.lid,.hl .shackle,.pinov{transition-duration:.01s}.pinov.unl .hl{animation:none}}
/* ===== غلاف 3D v2 ===== */
.pinov{background:radial-gradient(ellipse at 50% 28%,#2b4170 0,#122244 55%,#070f24 100%)}
.stage{animation:fl 5s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-8px)}}
.book{filter:drop-shadow(0 22px 22px #000a)}
.book .pg{background:linear-gradient(90deg,#efe2c8,#fffaf0 14%,#fff7e8);border:0;color:#5a3f1a;box-shadow:-1px 1px 0 #e6d8bc,-2px 2px 0 #fffaf0,-3px 3px 0 #e6d8bc,-4px 4px 0 #fffaf0,-5px 5px 0 #e6d8bc,-6px 6px 0 #fffaf0,-7px 7px 0 #e6d8bc,-8px 8px 0 #fffaf0,-9px 9px 0 #e6d8bc,-10px 10px 0 #1a2f5a,-11px 11px 0 #14264b,-12px 12px 0 #0f1e3d,-13px 13px 0 #0a1630}
.book .pg .big{color:#a8691a}
.book .pg .dt,.book .pg .ln{color:#8a6a3a}
.fr{background:radial-gradient(circle at 30% 18%,#34559a,#17294f 55%,#0b1631);border:0;color:#f6d98a;box-shadow:inset -14px 0 16px #0009,inset 3px 0 5px #ffffff30,inset 0 2px 3px #ffffff30}
.fr::before{content:"";position:absolute;inset:12px 22px 12px 12px;border:2px solid #d9a93a;border-radius:3px 10px 10px 3px;opacity:.8;pointer-events:none}
.fr .t{background:linear-gradient(180deg,#fff0b8,#e0a02b 60%,#9a6414);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;filter:drop-shadow(0 2px 2px #000a)}
.fr .h{color:#d9b878}
.bk{background:linear-gradient(90deg,#0f1e3d,#1b2f57);border:0;color:#d9a93a}
.hl{filter:drop-shadow(0 5px 4px #000b)}
.ctrl h2{color:#fbeacb}.ctrl .sub,.ctrl .lnk{color:#aebbd8}.ctrl .err{color:#ff9aa8}
.pad button{background:linear-gradient(180deg,#3d5d9c,#223a6c);border:0;color:#fbeacb;box-shadow:0 5px 0 #0a1630,0 9px 14px #0008,inset 0 1px 0 #ffffff40;transition:transform .08s,box-shadow .08s}
.pad button:active{background:linear-gradient(180deg,#34528c,#1b3160);transform:translateY(4px);box-shadow:0 1px 0 #0a1630,0 3px 6px #0008,inset 0 1px 0 #ffffff30}
@media (min-aspect-ratio:5/4){.pinov{gap:clamp(40px,7vw,90px)}}
@media (prefers-reduced-motion:reduce){.stage{animation:none}}
.pd{stroke:#f6d98a}.pd.f{fill:#f6d98a}
.hl{width:calc(var(--bh)*.52)}

/* ===== v3: سينما الفتح ===== */
.book{transform:rotateX(4deg) rotateY(-9deg)}
.pinov.open .book{transform:translateX(-14%) rotateX(2deg) rotateY(-4deg)}
.pinov.out{transition-duration:.9s}
.stage{will-change:transform}
.lt{position:absolute;inset:-18%;border-radius:40%;background:radial-gradient(circle,#fff1b8cc 0,#f6c75a66 35%,transparent 68%);opacity:0;transform:translateZ(-3px);transition:opacity 1.2s ease;pointer-events:none;filter:blur(6px)}
.pinov.unl .lt{opacity:.35}
.pinov.open .lt{opacity:1}
.pinov.open .pg{transform-origin:right center;animation:brz 2.8s ease-in-out 1.2s infinite alternate}
@keyframes brz{from{transform:rotateY(0)}to{transform:rotateY(-2.5deg) skewY(.4deg)}}
.hl{transition:filter .6s}
.pinov.rec .hl{filter:drop-shadow(0 5px 4px #000b) drop-shadow(0 0 8px #f6d98a99)}
.pinov.unl .hl{animation:none;filter:drop-shadow(0 5px 4px #000b) drop-shadow(0 0 20px #ffd86a)}
.hl .ht{transition:fill .6s,opacity .6s}
.pinov.unl .hl .ht{fill:#fff2b5;opacity:1}
.pinov.unl .shackle{transform:translate(0,-10px)}
.pinov.open .shackle{transform:translate(-3px,-10px) rotate(-32deg)}
.dots{display:flex;gap:12px;direction:ltr;margin:6px 0 2px}
.dots i{width:14px;height:14px;border-radius:50%;border:1.5px solid #c9a24a88;background:#c9a24a22;transition:background .35s,box-shadow .35s,border-color .35s,transform .35s cubic-bezier(.3,1.6,.5,1)}
.dots i.f{background:radial-gradient(circle at 35% 30%,#fffbe0,#f6d98a 45%,#d99a2b);border-color:#ffe9a8;box-shadow:0 0 10px 2px #f6d98acc,0 0 22px 4px #f6d98a66;transform:scale(1.18)}
.pinov.rec .dots i.f{box-shadow:0 0 14px 4px #ffe08a,0 0 30px 8px #f6c75a88}
.ctrl>*{transition:opacity .5s}
.pinov.unl .ctrl{opacity:1}
.pinov.rec .ctrl{pointer-events:none}
.pinov.rec .ctrl>*:not(.dots){opacity:0}
.pinov.zoom .ctrl{opacity:0}
.pad button{transition:transform .38s cubic-bezier(.3,1.7,.5,1),box-shadow .38s,background .2s}
.pad button:active{transition-duration:.05s}
.pinov.zoom .stage{animation:zm 2.4s cubic-bezier(.4,0,.2,1) forwards}
.pinov.zoom .book{filter:none}
@keyframes zm{from{transform:translateY(0) scale(1)}to{transform:translateY(0) scale(2.5)}}
.lid{transition:transform 1.5s cubic-bezier(.45,0,.25,1)}
.pinov.open .book{transition:transform 1.5s cubic-bezier(.45,0,.25,1)}
.ivory{position:absolute;inset:0;z-index:6;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 50%,#fffef6 0,#fbeec6 45%,#f0cf7e 100%)}
.pinov.zoom .ivory{opacity:1;transition:opacity 1.4s ease .9s}
.fx{position:absolute;inset:0;pointer-events:none;z-index:5;overflow:hidden}
.fx .sp{position:absolute;border-radius:50%;background:radial-gradient(#fff6c8,#f2b93b);box-shadow:0 0 6px 2px #f6d98a}
.fx .orb{position:absolute;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle,#fff8d0,#f6c75a 45%,transparent 70%);box-shadow:0 0 24px 10px #f6d98a99}
.snd{position:absolute;top:10px;left:10px;z-index:7;width:40px;height:40px;border-radius:50%;padding:0;font-size:18px;background:#ffffff1c;border:1px solid #f6d98a55;color:#fbeacb;box-shadow:none}
.ctrl .err{color:#ffc0cb}
@media (prefers-reduced-motion:reduce){.pinov.open .pg{animation:none}.pinov.zoom .stage{animation-duration:.01s}.pad button{transition-duration:.01s}}
.cam [hidden],.camrow[hidden],#main [hidden]{display:none!important}
.cam{position:relative;border-radius:22px;overflow:hidden;background:#1b1b24;aspect-ratio:3/4;width:min(100%,calc(50vh*.75));margin:10px auto;border:2px solid var(--line)}
.cam video,.cam img{width:100%;height:100%;object-fit:cover;display:block}
.cam video.mir{transform:scaleX(-1)}
.camrow{display:flex;align-items:center;justify-content:center;gap:22px;margin:6px 0}
.shut{width:74px;height:74px;border-radius:50%;border:5px solid #fff;background:var(--pink);box-shadow:0 0 0 3px var(--pink),0 6px 14px #ff5c9a55;padding:0;transition:transform .3s cubic-bezier(.3,1.7,.5,1)}
.shut:active{transform:scale(.88)}
.rnd{width:48px;height:48px;border-radius:50%;padding:0;font-size:22px}
.ic{background:#fff;border:2px solid var(--line);border-radius:22px;overflow:hidden;margin:14px 0;position:relative}
.ic img{width:100%;display:block}
.ic .cp{padding:10px 14px 4px;font-weight:600;color:var(--ink);word-break:break-word}
.ic .mt{padding:2px 14px 10px;color:var(--soft);font-size:13px}
.ic .x{position:absolute;top:8px;left:8px}
.top button{position:relative}
.top .rd{top:4px;inset-inline-end:4px}
.rx{display:flex;gap:8px;align-items:center;padding:6px 14px 4px;flex-wrap:wrap}
.hb{background:#fff;border:2px solid var(--line);color:var(--ink);padding:4px 14px;font-size:16px}
.hb.on{background:#ffe3ee;border-color:var(--pink)}
.rc{padding:0 14px 4px;font-size:14px;color:var(--ink);word-break:break-word}
.rin{display:flex;gap:6px;padding:4px 14px 12px;align-items:center}
.rin input{flex:1;padding:8px 12px;border-radius:16px}
.grid .hrt{position:absolute;bottom:6px;right:6px;padding:2px 10px;font-size:15px;background:#fffd}
.moods{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.moods button{background:#fff;border:2px solid var(--line);font-size:24px;padding:4px 10px;border-radius:16px}
.moods button.on{background:#ffe3ee;border-color:var(--pink)}
.lb{position:fixed;inset:0;background:#000d;z-index:400;display:flex;align-items:center;justify-content:center}
.lb img{max-width:96vw;max-height:92vh;border-radius:12px}
details.card summary{cursor:pointer;font-weight:700}
details.card ol{margin:8px 0;padding-inline-start:22px;font-size:15px}
.ver{position:fixed;bottom:2px;left:6px;font-size:10px;opacity:.55;pointer-events:none;z-index:3}
.upd{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:500;background:#ffd66b;color:#5a3a00;padding:10px 16px;border-radius:999px;font-weight:700;font-size:14px;box-shadow:0 6px 18px #0004;cursor:pointer;max-width:92vw;text-align:center}
.cm{display:flex;gap:6px;align-items:baseline;margin:4px 0;font-size:14px;line-height:1.6;text-align:right}.cm b{white-space:nowrap}.cmx{background:none;border:0;color:#b88;font-size:12px;padding:0 4px;margin-inline-start:auto;box-shadow:none;width:auto;min-width:0}.cmn{margin-inline-start:8px;opacity:.6}
.abar{height:14px;border-radius:9px;background:#ffe3ee;overflow:hidden;margin:6px 0}.abar i{display:block;height:100%;border-radius:9px}
.ag{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:4px;text-align:center;font-size:14px;margin-top:4px}
.tg{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0}.tg input[type=checkbox]{width:22px;height:22px;accent-color:var(--pink)}.tg input[type=time]{font:inherit;color:var(--ink);background:#fff8fb;border:2px solid var(--line);border-radius:12px;padding:6px;direction:ltr}

/* ===== v3.6-c5: وضع الكود الكاذب = تطبيق ملاحظات عادي ===== */
body.dcy{background:#f2f2f0;color:#222;font-family:system-ui,"Segoe UI",Tahoma,sans-serif}
body.dcy .top,body.dcy #cnt,body.dcy #nav,body.dcy #pushBox,body.dcy .ver{display:none!important}
body.dcy #app{padding-top:calc(18px + env(safe-area-inset-top,0px))}
.nt-bar{display:flex;justify-content:space-between;align-items:center;margin:6px 0 14px}
.nt-h{margin:0;font-size:32px;text-align:start}
.nt-add{background:#e9b949;color:#fff;width:42px;height:42px;padding:0;font-size:26px;line-height:1;border-radius:50%}
.nt-lk{background:none;color:#b5841a;padding:6px 4px;font-size:17px;font-weight:600}
.nt-c{background:#fff;border-radius:14px;padding:12px 14px;margin:8px 0;cursor:pointer;box-shadow:0 1px 2px #0001}
.nt-c b{display:block;font-size:17px;color:#222}
.nt-p{font-size:14px;color:#888;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nt-e{text-align:center;color:#999;padding:40px 0}
input.nt-t{background:transparent;border:0;border-radius:0;padding:8px 0;font-size:24px;font-weight:700;color:#222}
textarea.nt-b{background:transparent;border:0;border-radius:0;padding:8px 0;min-height:60vh;font-size:17px;color:#222}

/* ===== v3.6-c6: أغنية النهار 🎵 ===== */
.nav button{padding:6px 4px;font-size:11px}
.sg{background:#fff;border:2px solid var(--line);border-radius:22px;overflow:hidden;margin:12px 0}
.sgm{position:relative}
.sgt{position:relative;aspect-ratio:16/9;background:linear-gradient(135deg,#ffd3e4,#ffe9a8);background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center}
.sgn{font-size:54px;opacity:.7}
.sgp{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;padding:0;font-size:24px;line-height:1;background:#ff5c9acc;box-shadow:0 6px 16px #0004}
.sgf{display:block;width:100%;aspect-ratio:16/9;border:0}
.sgf.sp{aspect-ratio:auto}
.sgi{padding:10px 14px 12px}
.sgmsg{margin-top:6px;white-space:pre-wrap;word-break:break-word}
.sgl{display:inline-block;font-size:13px;color:var(--soft)}
.sg.sm .sgt{aspect-ratio:21/8}
.sg.sm .sgp{width:46px;height:46px;font-size:18px}

/* ===== v3.6-c7: تقريرنا + رسالة سرية مفاجأة ===== */
#cnt{cursor:pointer}
.rpn{font-size:20px;font-weight:700;color:var(--pink)}

<script>
const SPACE='1449f144-7e6a-40fc-b9d6-08962201d5e2', BUCKET='our-files';
const START=new Date(2026,9,10,12);          // النهار 1 = 10 أكتوبر 2026

const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const dayDate=n=>{const d=new Date(START);d.setDate(d.getDate()+n-1);return d};

function h(t,a={},...k){const e=document.createElement(t);for(const[x,v]of Object.entries(a)){if(x==='class')e.className=v;else if(x.startsWith('on'))e[x]=v;else e.setAttribute(x,v)}k.flat().forEach(c=>{if(c!=null)e.append(c)});return e}
let sb,me,tab='today',viewDay=null,poll=null;
/* v3.6-c4: وضع الكود الكاذب (DECOY) */
let DECOY=false,metaP=Promise.resolve(),DM=[],DF={j:'',a:'',mood:null};

function show(id){['setup','login','app'].forEach(i=>$('#'+i).classList.toggle('on',i===id))}
function boot(){
  const u=localStorage.getItem('sbu'),k=localStorage.getItem('sbk');

  sb.auth.getSession().then(({data})=>{if(data.session){me=data.session.user;gate()}else show('login')});

async function login(){

async function dropPush(){try{const reg=await navigator.serviceWorker.getRegistration();const sub=reg&&await reg.pushManager.getSubscription();if(sub){await sb.from('push_subs').delete().eq('endpoint',sub.endpoint);await sub.unsubscribe()}}catch(e){}}
async function logout(){await dropPush();await sb.auth.signOut();clearPin();me=null;isAdmin=false;DECOY=false;{const b=$('#admBtn');if(b)b.hidden=true}show('login')}

const TABS=[['today','📖','اليوم'],['days','📅','الأيام'],['zwin','💌','زوين'],['inst','⚡','لحظة'],['pics','📸','تصاور'],['song','🎵','أغنية'],['game','🎲','لعبة']];
let tk;
function tick(){
  const n=new Date(),s=Math.floor((n-new Date(n.getFullYear(),n.getMonth(),n.getDate()))/1000),d=todayN(),hh=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=s%60;
  $('#cnt').replaceChildren(h('div',{class:'st'},'من أول هضرة بينا 💞'),h('b',{},d+' يوم و '+hh+' ساعة و '+m+' دقيقة و '+ss+' ثانية'));
}

const PIN_LEN=6,PIN_RELOCK=30000;
let pinBuf='',pinMode='',pinFirst='',pinDone=null,pinBusy=false,pinT=null,hiddenAt=0;
const pinStored=()=>{try{return JSON.parse(localStorage.getItem('kpin')||'null')}catch(e){return null}};
const clearPin=()=>['kpin','kpinfail','kpinlock','kdecoy'].forEach(k=>localStorage.removeItem(k));
const b64=u=>btoa(String.fromCharCode(...u)), unb64=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
async function pinHash(pin,salt,it){
  const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt,iterations:it},k,256));
}
const sameBytes=(a,b)=>{if(a.length!==b.length)return false;let r=0;for(let i=0;i<a.length;i++)r|=a[i]^b[i];return r===0};
/* الكود الكاذب: مخزن كهاش فـ app_settings (decoy_pin = salt.hash.iterations)، والافتراضي 000000 */
async function decoyMatch(v){
  const s=APPSET.decoy_pin||localStorage.getItem('kdecoy');
  if(typeof s==='string'&&s.split('.').length===3){
    const [a,b,c]=s.split('.');
    try{return sameBytes(await pinHash(v,unb64(a),+c),unb64(b))}catch(e){return false}
  }
  return v==='000000';
}
const pinMsg=t=>{$('#pinE').textContent=t||''};
function pinRender(all){const n=all?PIN_LEN:pinBuf.length;['#pin .pd','#pinD i'].forEach(q=>document.querySelectorAll(q).forEach((e,i)=>e.classList.toggle('f',i<n)))}
function pinTexts(){
  const T={setup1:['دير كود سري 🔒','6 أرقام. غير نتا لي كتعرفو'],setup2:['عاود كتب نفس الكود','باش نتأكدو'],unlock:['دخل الكود 🔒','كتابنا محمي']}[pinMode];
  $('#pinT').textContent=T[0];$('#pinS').textContent=T[1];$('#pinF').hidden=pinMode!=='unlock';
}
function pinLockLeft(){const u=+localStorage.getItem('kpinlock')||0;return Math.max(0,Math.ceil((u-Date.now())/1000))}
function pinTick(){
  clearTimeout(pinT);const l=pinLockLeft(),off=l>0;
  $('#pinP').querySelectorAll('button').forEach(b=>b.disabled=off);
  if(off){pinMsg('بزاف د المحاولات. عاود من بعد '+l+' ثانية');pinT=setTimeout(pinTick,1000)}
  else if($('#pinE').textContent.startsWith('بزاف'))pinMsg('');
}
function pinBuild(){
  const pad=$('#pinP');pad.replaceChildren();
  ['1','2','3','4','5','6','7','8','9','','0','b'].forEach(k=>{
    if(k==='')return pad.append(h('button',{class:'nb',tabindex:'-1','aria-hidden':'true'},' '));
    pad.append(h('button',{type:'button','data-k':k,'aria-label':k==='b'?'مسح':k,onclick:()=>pinKey(k)},k==='b'?'⌫':k));
  });
}
function pinOpen(mode,done){
  pinMode=mode;pinDone=done;pinBuf='';pinFirst='';pinBusy=false;
  if(!$('#pinP').children.length)pinBuild();
  pinTexts();pinMsg('');pinRender();const c=$('#pin');pinTm.forEach(clearTimeout);pinTm=[];c.classList.remove('rec','unl','open','zoom','out');c.hidden=false;pinTick();
}
const RM=()=>matchMedia('(prefers-reduced-motion:reduce)').matches;
let pinTm=[];const later=(f,ms)=>pinTm.push(setTimeout(f,ms));
const BASE='rotateX(4deg) rotateY(-9deg)';
const buzz=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
/* ---- صوت (كيتخدم غير من بعد أول لمسة) ---- */
let AC=null,sndOn=localStorage.getItem('ksnd')!=='0';
function ac(){if(!sndOn)return null;try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){return null}return AC}
function tone(f,d,v,type,t0,f2){const c=ac();if(!c)return;const t=c.currentTime+(t0||0),o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.03)}
function noise(d,v,f0,f1,t0,type){const c=ac();if(!c)return;const n=Math.floor(c.sampleRate*d),bf=c.createBuffer(1,n,c.sampleRate),a=bf.getChannelData(0);for(let i=0;i<n;i++)a[i]=Math.random()*2-1;const sr=c.createBufferSource();sr.buffer=bf;const fl=c.createBiquadFilter();fl.type=type||'bandpass';const t=c.currentTime+(t0||0);fl.frequency.setValueAtTime(f0,t);fl.frequency.linearRampToValueAtTime(f1,t+d);const g=c.createGain();g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+d*.3);g.gain.linearRampToValueAtTime(.0001,t+d);sr.connect(fl);fl.connect(g);g.connect(c.destination);sr.start(t)}
const SND={
  key(){tone(1400,.05,.05,'sine',0,700);noise(.03,.04,3000,2000,0,'highpass')},
  back(){tone(900,.05,.04,'sine',0,500)},
  err(){tone(220,.18,.05,'triangle',0,160)},
  unlock(){noise(.05,.12,4000,3000,0,'highpass');tone(2400,.5,.05,'sine',.02,2300);tone(3600,.35,.025,'sine',.04);tone(180,.12,.08,'triangle',.05,90)},
  cover(){tone(90,.45,.14,'sine',0,45);noise(.5,.06,500,200,0,'lowpass')},
  pages(){for(let i=0;i<5;i++)noise(.22,.035,2500+i*200,1500,i*.28,'bandpass')}
};
/* ---- حركات ---- */
function sparks(x,y,n,r){
  if(RM())return;const L=$('#pinFx');
  for(let i=0;i<n;i++){
    const s=document.createElement('span');s.className='sp';const a=Math.random()*6.283,d=r*(.5+Math.random()*.8),z=2+Math.random()*3;
    s.style.cssText='left:'+x+'px;top:'+y+'px;width:'+z+'px;height:'+z+'px';L.append(s);
    const an=s.animate([{transform:'translate(-50%,-50%) scale(1)',opacity:1},{transform:'translate(calc(-50% + '+Math.cos(a)*d+'px),calc(-50% + '+(Math.sin(a)*d-12)+'px)) scale(0)',opacity:0}],{duration:500+Math.random()*400,easing:'cubic-bezier(.2,.7,.3,1)'});
    an.onfinish=()=>s.remove();
  }
}
function lockTick(d){
  if(RM())return;const sh=document.querySelector('#hl .shackle'),hl=$('#hl');
  if(sh)sh.animate([{transform:'translateY(0)'},{transform:'translateY('+(-2.2*d)+'px) rotate('+(1.5*d)+'deg)'},{transform:'translateY(0)'}],{duration:220,easing:'cubic-bezier(.3,1.6,.5,1)'});
  hl.animate([{transform:'rotate(0)'},{transform:'rotate('+(-1.4*d)+'deg) translateY(1px)'},{transform:'rotate(0)'}],{duration:200});
}
function bookNudge(d){
  if(RM())return;
  $('#pin .book').animate([{transform:BASE},{transform:'rotateX('+(4+d*.9)+'deg) rotateY('+(-9-d*1.4)+'deg) translateY(1px)'},{transform:BASE}],{duration:260,easing:'cubic-bezier(.3,1.5,.5,1)'});
}
function bookShake(){
  if(RM())return;
  $('#pin .book').animate([{transform:BASE},{transform:'translateX(-7px) '+BASE},{transform:'translateX(7px) '+BASE},{transform:'translateX(-4px) '+BASE},{transform:'translateX(3px) '+BASE},{transform:BASE}],{duration:380,easing:'ease-out'});
}
function pinFx(k){
  if(k==='b'){SND.back();buzz(5);lockTick(-1);bookNudge(-1);return}
  SND.key();buzz(8);
  const b=document.querySelector('#pinP [data-k="'+k+'"]');
  if(b){const r=b.getBoundingClientRect();sparks(r.left+r.width/2,r.top+r.height/2,7,34)}
  lockTick(1);bookNudge(1);
}
function orb(){
  if(RM())return;
  const a=$('#pinP').getBoundingClientRect(),b=$('#pin .book').getBoundingClientRect(),L=$('#pinFx'),o=document.createElement('span');
  o.className='orb';const x0=a.left+a.width/2,y0=a.top+a.height/2,dx=b.left+b.width/2-x0,dy=b.top+b.height*.55-y0;
  o.style.left=x0+'px';o.style.top=y0+'px';L.append(o);
  const T=(x,y,sc)=>'translate(calc(-50% + '+x+'px),calc(-50% + '+y+'px)) scale('+sc+')';
  const an=o.animate([{transform:T(0,0,.5),opacity:0},{transform:T(dx*.2,dy*.2,.8),opacity:1,offset:.2},{transform:T(dx,dy,1.4),opacity:.9,offset:.85},{transform:T(dx,dy,2.4),opacity:0}],{duration:850,easing:'ease-in-out'});
  an.onfinish=()=>o.remove();
}
/* ---- الفتح: A تعرّف، B القفل، C الغلاف، D الكاميرا ---- */
function pinOk(isDec){
  const c=$('#pin'),k=RM()?.2:1;
  if(c.classList.contains('rec'))return;
  const prev=DECOY;DECOY=!!isDec;
  pinTm.forEach(clearTimeout);pinTm=[];
  pinBuf='';pinRender(true);
  $('#cvDay').textContent='النهار '+todayN();$('#cvDate').textContent=fmt(new Date());
  c.classList.add('rec');buzz(15);orb();
  later(()=>{c.classList.add('unl');SND.unlock();buzz([25,40,25]);const r=$('#hl').getBoundingClientRect();sparks(r.left+r.width/2,r.top+r.height*.4,22,70)},700*k);
  later(()=>{const r=$('#hl').getBoundingClientRect();sparks(r.left+r.width/2,r.top+r.height*.6,14,50)},1200*k);
  later(()=>{c.classList.add('open');SND.cover()},1700*k);
  later(()=>SND.pages(),2400*k);
  later(()=>c.classList.add('zoom'),3000*k);
  later(()=>{const d=pinDone;pinDone=null;if(d)d();else if(prev!==DECOY)start()},5000*k);
  later(()=>c.classList.add('out'),5200*k);
  later(()=>{c.hidden=true;c.classList.remove('rec','unl','open','zoom','out');pinRender()},6400*k);
}
function pinShake(){const d=$('#hl');d.classList.remove('shake');void d.getBoundingClientRect();d.classList.add('shake');bookShake();SND.err();buzz([40,40,40])}
async function pinKey(k){
  if(pinBusy||pinLockLeft()>0||$('#pin').classList.contains('rec'))return;
  if(k==='b'){if(!pinBuf)return;pinBuf=pinBuf.slice(0,-1);pinMsg('');pinFx('b');return pinRender()}
  if(pinBuf.length>=PIN_LEN)return;
  pinBuf+=k;pinRender();pinFx(k);
  if(pinBuf.length<PIN_LEN)return;
  const v=pinBuf;pinBusy=true;
  try{
    if(pinMode==='setup1'){pinFirst=v;pinBuf='';pinMode='setup2';pinTexts();pinRender();return}
    if(pinMode==='setup2'){
      if(v!==pinFirst){pinMode='setup1';pinBuf='';pinFirst='';pinTexts();pinRender();pinShake();pinMsg('ما تطابقاش، عاود من الأول');return}
      await Promise.race([metaP,new Promise(r=>setTimeout(r,1500))]);
      if(await decoyMatch(v)){pinMode='setup1';pinBuf='';pinFirst='';pinTexts();pinRender();pinShake();pinMsg('هاد الكود ما يصلحش، ختار كود آخر');return}
      const salt=crypto.getRandomValues(new Uint8Array(16)),it=150000;
      const hh=await pinHash(v,salt,it);
      localStorage.setItem('kpin',JSON.stringify({s:b64(salt),h:b64(hh),i:it}));
      localStorage.removeItem('kpinfail');localStorage.removeItem('kpinlock');
      return pinOk(false);
    }
    const st=pinStored();
    if(!st)return pinForgot(true);
    const hh=await pinHash(v,unb64(st.s),st.i);
    if(sameBytes(hh,unb64(st.h))){localStorage.removeItem('kpinfail');localStorage.removeItem('kpinlock');return pinOk(false)}
    await Promise.race([metaP,new Promise(r=>setTimeout(r,1500))]);
    if(await decoyMatch(v))return pinOk(true);
    const f=(+localStorage.getItem('kpinfail')||0)+1;localStorage.setItem('kpinfail',f);
    pinBuf='';pinRender();pinShake();

let SGC=[];

function songInfo(u){
  try{
    const x=new URL(songNorm(u)),hn=x.hostname.replace(/^(www\.|m\.|music\.)/,'');
    let id=null;
    if(hn==='youtu.be')id=x.pathname.slice(1).split('/')[0];
    else if(hn==='youtube.com'){
      if(x.pathname==='/watch')id=x.searchParams.get('v');
      else{const m=x.pathname.match(/^\/(shorts|embed|live)\/([\w-]{11})/);if(m)id=m[2]}
    }

    if(hn==='open.spotify.com'){const m=x.pathname.match(/\/(track|album|playlist|episode)\/([A-Za-z0-9]{22})/);if(m)return {k:'sp',t:m[1],id:m[2]}}
  }catch(e){}

}

const VAPID_PUB='BJRvWD5DPfZZKvSJKopRSlbawEFvJJgCdGOzrJzya3-GZxenMMC1ZSKcj0Wd41mJJV54S0GG_mVkTRGmJDbhCu0';
const u8=s=>{const p='='.repeat((4-s.length%4)%4),r=atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(r,c=>c.charCodeAt(0))};

async function pushUI(){
  const box=$('#pushBox');if(!box)return;
  if(!pushOK()){box.hidden=true;return}
  let sub=null;
  try{const reg=await navigator.serviceWorker.getRegistration();sub=reg?await reg.pushManager.getSubscription():null}catch(e){}
  if(sub&&Notification.permission==='granted'){const r=await saveSub(sub);if(!r.error){box.hidden=true;return}if(r.error.code==='42501'||/row-level/i.test(r.error.message||'')){try{await sub.unsubscribe()}catch(e){}sub=null}else{box.hidden=true;return}}

      b.disabled=true;

      await navigator.serviceWorker.ready;
      let s=await reg.pushManager.getSubscription();
      if(!s)s=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:u8(VAPID_PUB)});
      const r=await saveSub(s);
      if(r.error){msg.textContent='ما تحفظاتش: '+r.error.message;b.disabled=false;return}

  {const v=$('#ver');if(v){v.textContent='نسخة '+document.querySelector('meta[name=app-ver]').content+' · '+why;v.style.opacity=1;v.style.fontSize='13px'}}
  try{const r=await sb.from('app_settings').select('*');APPSET={};(r.data||[]).forEach(x=>{APPSET[x.key]=x.value})}catch(e){}
  try{if(typeof APPSET.decoy_pin==='string')localStorage.setItem('kdecoy',APPSET.decoy_pin)}catch(e){}
  const b=$('#admBtn');if(b)b.hidden=!isAdmin||DECOY;
}
function logAct(k){if(DECOY)return;if(k==='open')lastOpen=Date.now();try{sb.from('activity_log').insert({kind:k}).then(()=>{},()=>{})}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&me&&$('#pin').hidden&&Date.now()-lastOpen>600000)logAct('open')});
const fmtB=b=>b>=1073741824?(b/1073741824).toFixed(2)+' Go':(b/1048576).toFixed(1)+' Mo';
const fmtDT=x=>x?new Date(x).toLocaleString('ar-MA',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'}):'ما كاينش';
async function setSet(k,v,er){
  const r=await sb.from('app_settings').upsert({key:k,value:v,updated_at:new Date().toISOString()},{onConflict:'key'});
  if(r.error){er.textContent='ما تحفظاتش: '+r.error.message;return}
  APPSET[k]=v;er.textContent='تحفظات ✓';
}
async function adminBackup(msg){
  msg.textContent='كنجمع المعطيات…';
  const out={exported_at:new Date().toISOString(),note:'روابط الصور والأوديوهات فقط، ماشي الملفات'};
  for(const t of ['day_entries','messages','photos','photo_comments','photo_reacts','question_answers','our_notes','day_moods','special_days','chat_snippets','countdowns','songs']){
    try{let q=sb.from(t).select('*');if(t!=='photo_comments'&&t!=='photo_reacts')q=q.eq('space_id',SPACE);const r=await q;out[t]=r.error?('خطأ: '+r.error.message):r.data}catch(e){out[t]='خطأ'}
  }
  try{const r=await sb.from('secret_letters').select('*').eq('space_id',SPACE).eq('created_by',me.id);out.secret_letters_mine=r.error?null:r.data}catch(e){}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(out,null,1)],{type:'application/json'}));
  a.download='kitabna-backup-'+iso(new Date())+'.json';document.body.append(a);a.click();a.remove();msg.textContent='تحمّل الملف ✓';
}
async function adminPage(){
  if(!isAdmin||DECOY)return h('div',{class:'card'},'ما مسموحش');
  let dv=[],dverr=null;
  try{const r=await sb.from('devices').select('*').order('last_seen',{ascending:false});dv=r.data||[];dverr=r.error}catch(e){dverr=e}
  const box=h('div',{},h('h1',{},'⚙️ الإعدادات'),h('p',{class:'sub'},'خاصة بالأدمن'));
  if(dv.some(r=>r.is_new&&!r.ack))box.append(h('div',{class:'card sun'},h('b',{class:'t'},'⚠️ جهاز جديد'),h('div',{},'تسجل جهاز جديد فواحد من الحسابين. شوف اللائحة تحت (📱 الأجهزة).')));
  const sc=h('div',{class:'card'},h('b',{class:'t'},'💾 التخزين'));
  const sr=await sb.rpc('admin_stats');
  if(sr.error)sc.append(h('div',{class:'err'},'خاصك تدير SQL ديال الأدمن: '+sr.error.message));
  else{
    const s=sr.data,TOT=1073741824,pc=Math.min(100,s.bytes/TOT*100),col=pc<70?'#3bb273':pc<90?'#f0a020':'#e0334f';
    sc.append(h('div',{class:'abar'},h('i',{style:'width:'+pc.toFixed(1)+'%;background:'+col})),
      h('div',{class:'st'},'مستعمل: '+fmtB(s.bytes)+' من 1 Go ('+pc.toFixed(1)+'%) · باقي: '+fmtB(Math.max(0,TOT-s.bytes))+' ('+(100-pc).toFixed(1)+'%)'),
      h('div',{style:'margin-top:8px'},'📸 صور: '+s.photos+' · 🎙️ أوديوهات: '+s.audios+' · 💬 رسائل: '+s.messages+' · 📖 كتابات: '+s.entries));
  }
  box.append(sc);
  const days=[];for(let i=0;i<7;i++){const d=new Date();d.setDate(d.getDate()-i);days.push(iso(d))}
  const oldest=days[6];
  const [rl,lg,en,qa]=await Promise.all([
    sb.from('user_roles').select('user_id,role'),
    sb.from('activity_log').select('user_id,kind,created_at').order('created_at',{ascending:false}).limit(1000),
    sb.from('day_entries').select('author_id,day,content,audio_path,photo_path').eq('space_id',SPACE).gte('day',oldest),
    sb.from('question_answers').select('author_id,day').eq('space_id',SPACE).gte('day',oldest)]);
  const oth=((rl.data||[]).find(r=>r.user_id!==me.id)||{}).user_id;
  const person=(id,title)=>{
    const L=(lg.data||[]).filter(x=>x.user_id===id),
      E=(en.data||[]).filter(x=>x.author_id===id&&((x.content&&x.content.trim())||x.audio_path||x.photo_path)),
      Q=(qa.data||[]).filter(x=>x.author_id===id),
      lastK=k=>{const r=L.find(x=>x.kind===k);return r?r.created_at:null},
      dl=new Set(L.map(x=>iso(new Date(x.created_at)))),td=days[0],yn=b=>b?'✅ نعم':'❌ لا';
    const c=h('div',{class:'card'},h('b',{class:'t'},title),
      h('div',{},'🔑 آخر دخول بكلمة السر: '+fmtDT(lastK('login'))),
      h('div',{},'👀 آخر فتح للتطبيق: '+fmtDT(lastK('open')||lastK('login'))),
      h('div',{},'❓ جاوب سؤال اليوم: '+yn(Q.some(x=>x.day===td))),
      h('div',{},'📖 كتب فاليوم: '+yn(E.some(x=>x.day===td))));
    const g=h('div',{class:'ag'},h('b',{},'التاريخ'),h('b',{},'🔑'),h('b',{},'📖'),h('b',{},'❓'));
    days.forEach(d=>g.append(h('span',{},d.slice(5)),h('span',{},dl.has(d)?'✅':'—'),h('span',{},E.some(x=>x.day===d)?'✅':'—'),h('span',{},Q.some(x=>x.day===d)?'✅':'—')));
    c.append(h('div',{class:'st',style:'margin-top:8px'},'آخر 7 أيام'),g);return c;
  };
  box.append(oth?person(oth,nm()+' '+ic()):h('div',{class:'card'},'خاصك تزيد الدور ديال الحساب الآخر فـ user_roles (شوف SQL)'));
  box.append(person(me.id,'أنا (عادل) 💙'));
  /* 📱 الأجهزة */
  const dc=h('div',{class:'card'},h('b',{class:'t'},'📱 الأجهزة'));
  if(dverr)dc.append(h('div',{class:'err'},'خاصك تدير SQL ديال الأجهزة: '+(dverr.message||dverr)));
  else if(!dv.length)dc.append(h('div',{class:'st'},'ما كاين حتى جهاز مسجل بعد.'));
  dv.forEach(r=>{
    const mineD=r.user_id===me.id,nw=r.is_new&&!r.ack;
    const row=h('div',{style:'border-top:1px solid var(--line);padding:8px 0'},
      h('div',{},(nw?'🆕 ':'')+(mineD?'أنا (عادل)':nm()+' '+ic())+(r.device_id===devId()?' · هاد الجهاز':'')),
      h('div',{class:'st'},(r.label||'—')),
      h('div',{class:'st',style:'direction:ltr;text-align:right'},'ID: '+String(r.device_id).slice(0,8)),
      h('div',{class:'st'},'أول دخول: '+fmtDT(r.first_seen)+' · آخر دخول: '+fmtDT(r.last_seen)));
    if(nw)row.append(h('div',{class:'row'},h('button',{class:'ghost mini',onclick:async()=>{const x=await sb.from('devices').update({ack:true}).eq('id',r.id);if(x.error)alert(x.error.message);else{checkDev();render()}}},mineD?'هذا أنا ✓':'عرفتو ✓')));
    dc.append(row);
  });
  box.append(dc);
  const ser=h('div',{class:'err'});
  const tg=(k,t)=>{const i=h('input',{type:'checkbox'});i.checked=APPSET[k]!==false;i.onchange=()=>setSet(k,i.checked,ser);return h('label',{class:'tg'},h('span',{},t),i)};
  const tm=(k,t,def)=>{const i=h('input',{type:'time'});i.value=APPSET[k]||def;i.onchange=()=>{if(i.value)setSet(k,i.value,ser)};return h('label',{class:'tg'},h('span',{},t),i)};
  const bm=h('div',{class:'st'});
  box.append(h('div',{class:'card'},h('b',{class:'t'},'🛠️ إعدادات عامة'),
    tg('daily_push','إشعار الرسالة اليومية'),tm('daily_time','وقت الرسالة اليومية','09:00'),
    tm('question_time','وقت سؤال النهار','09:00'),tg('think','زر «كنفكر فيك»'),tg('compress','ضغط الصور الجديدة'),
    h('div',{class:'st'},'ملاحظة: الوقت وإشعار الرسالة اليومية كيتسجلو، وغيخدمو ملي نزيدو السيرفر ديال الرسائل التلقائية.'),ser));
  /* 🎭 الكود الكاذب */
  const di=h('input',{type:'text',inputmode:'numeric',maxlength:'6',placeholder:'6 أرقام',dir:'ltr'}),der=h('div',{class:'err'});
  box.append(h('div',{class:'card'},h('b',{class:'t'},'🎭 الكود الكاذب'),
    h('div',{class:'st'},'الحالي: '+(typeof APPSET.decoy_pin==='string'?'مخصص (مخفي)':'الافتراضي 000000')+' · كيفتح تطبيق فارغ بلا داطا حقيقية. نفس الكود للهاتفين.'),
    h('div',{style:'height:8px'}),di,
    h('div',{class:'row'},h('button',{onclick:async()=>{
      der.textContent='';
      const v=di.value.trim();
      if(!/^\d{6}$/.test(v)){der.textContent='خاصو يكون 6 أرقام';return}
      const st=pinStored();
      if(st&&sameBytes(await pinHash(v,unb64(st.s),st.i),unb64(st.h))){der.textContent='ما يمكنش يكون بحال الكود الحقيقي ديالك';return}
      const salt=crypto.getRandomValues(new Uint8Array(16)),it=150000,hh=await pinHash(v,salt,it);
      const val=b64(salt)+'.'+b64(hh)+'.'+it;
      await setSet('decoy_pin',val,der);
      if(der.textContent==='تحفظات ✓'){try{localStorage.setItem('kdecoy',val)}catch(e){}di.value=''}
    }},'بدّل الكود الكاذب')),der));
  box.append(h('div',{class:'card'},h('b',{class:'t'},'📦 نسخة احتياطية'),h('div',{class:'row'},h('button',{onclick:()=>adminBackup(bm)},'حمّل Backup ⬇️'),bm)));
  return box;
}

$('#cnt').onclick=()=>{if(me&&!DECOY)go('report')};
boot();
</script>
