<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffe3ee">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>كتابنا ♡</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#fff0f6;--card:#fff;--line:#ffc2d9;--ink:#5a2a41;--soft:#a5607f;--pink:#ff5c9a;--sun:#fff4c2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:linear-gradient(#ffe3ee,var(--bg) 220px);color:var(--ink);font-family:"Segoe UI",Tahoma,system-ui,sans-serif;font-size:17px;line-height:1.6;padding-bottom:110px}
.scr{display:none;max-width:560px;margin:0 auto;padding:18px 16px}
.scr.on{display:block}
.deco{text-align:center;font-size:26px;letter-spacing:8px;margin:4px 0}
h1{font-size:30px;margin:6px 0 2px;text-align:center}
h2{font-size:22px;margin:4px 0 10px}
.sub{text-align:center;color:var(--soft);margin:0 0 14px}
.card{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:14px 16px;margin:12px 0}
.card.sun{background:var(--sun);border-color:#f5d86a}
.card b.t{display:block;margin-bottom:6px}
textarea,input[type=text],input[type=email],input[type=password]{width:100%;font:inherit;color:var(--ink);background:#fff8fb;border:2px solid var(--line);border-radius:16px;padding:12px;direction:rtl}
textarea{min-height:130px;resize:vertical}
button{font:inherit;cursor:pointer;border:0;border-radius:999px;padding:10px 18px;background:var(--pink);color:#fff;font-weight:600}
button.ghost{background:#ffe3ee;color:var(--ink)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.st{color:var(--soft);font-size:14px}
.top{display:flex;justify-content:space-between;align-items:center;padding-top:env(safe-area-inset-top,0)}
.top button{background:#fff;border:2px solid var(--line);color:var(--ink);font-size:22px;padding:6px 12px}
.item{display:flex;gap:12px;align-items:center;cursor:pointer}
.dot{flex:none;width:46px;height:46px;border-radius:50%;background:#ffe3ee;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700}
.item.today .dot{background:var(--pink);color:#fff;border-color:var(--pink)}
.item .d{color:var(--soft);font-size:14px}
.nav{position:fixed;inset:auto 12px calc(12px + env(safe-area-inset-bottom,0)) 12px;max-width:540px;margin:0 auto;background:#fff;border:2px solid var(--line);border-radius:999px;display:flex;justify-content:space-around;padding:6px;box-shadow:0 6px 18px #ff5c9a33;z-index:5}
.nav button{background:none;color:var(--soft);border-radius:999px;padding:6px 10px;font-size:12px;line-height:1.3;font-weight:500}
.nav button span{display:block;font-size:22px}
.nav button.on{background:#ffe3ee;color:var(--pink);font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid div{position:relative}
.grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:18px;border:2px solid var(--line)}
.grid .x{position:absolute;top:6px;left:6px;padding:2px 8px;background:#fffc;color:var(--ink)}
audio{width:100%;margin-top:8px}
.ov{position:fixed;inset:0;background:var(--bg);z-index:10;display:none;flex-direction:column}
.ov.on{display:flex}
.ov .bar{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top,0))}
#ml{flex:1;overflow:auto;padding:0 14px;display:flex;flex-direction:column;gap:8px}
.b{max-width:80%;padding:8px 14px;border-radius:20px;background:#fff;border:2px solid var(--line);white-space:pre-wrap}
.b.me{align-self:flex-start;background:#ffd3e4}
.b.ot{align-self:flex-end}
#mf{display:flex;gap:8px;padding:10px 12px calc(12px + env(safe-area-inset-bottom,0))}
.err{color:#c0204f;font-size:14px;min-height:20px}
.cnt{text-align:center;padding:10px 14px;margin-top:4px}
.cnt b{font-size:18px}
.pic{width:100%;border-radius:18px;border:2px solid var(--line);margin-top:8px;display:block}
.cd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:4px 0}
.mini{padding:4px 10px;font-size:14px}
input[type=date]{font:inherit;color:var(--ink);background:#fff8fb;border:2px solid var(--line);border-radius:16px;padding:10px;direction:ltr}

.pinov{position:fixed;inset:0;z-index:300;background:radial-gradient(circle at 50% 25%,#ffe3ee,#ffc2d9);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(8px,2vh,22px);padding:10px;overflow:auto;text-align:center;transition:opacity .65s ease}
.pinov[hidden]{display:none}
.pinov.out{opacity:0;pointer-events:none}
.stage{perspective:1100px;flex:none}
.book{--bh:min(38vh,340px);position:relative;height:var(--bh);aspect-ratio:3/4;transform-style:preserve-3d;transition:transform 1.1s ease;filter:drop-shadow(0 12px 20px #ff5c9a55)}
.pinov.open .book{transform:translateX(-14%)}
.book .pg{position:absolute;inset:0;background:#fffafc;border:2px solid var(--line);border-radius:6px 18px 18px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:10px}
.book .pg .big{font-size:calc(var(--bh)*.115);font-weight:800;color:var(--pink);line-height:1.2}
.book .pg .dt{color:var(--soft);font-size:calc(var(--bh)*.052)}
.book .pg .ln{font-size:calc(var(--bh)*.048);margin-top:6px}
.book .pg .fl{font-size:calc(var(--bh)*.08)}
.lid{position:absolute;inset:0;transform-origin:right center;transform-style:preserve-3d;transition:transform 1.1s cubic-bezier(.5,0,.2,1)}
.pinov.open .lid{transform:rotateY(160deg)}
.face{position:absolute;inset:0;border-radius:6px 18px 18px 6px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--bh)*.02)}
.fr{background:linear-gradient(145deg,#ff7fb0,#ff5c9a);border:3px solid #ff3d86;color:#fff;box-shadow:inset -10px 0 0 #e8508c}
.fr .f{font-size:calc(var(--bh)*.07);letter-spacing:5px}
.fr .t{font-size:calc(var(--bh)*.105);font-weight:800}
.fr .h{font-size:calc(var(--bh)*.045);opacity:.9}
.bk{background:#ffd9e8;border:3px solid #ff9cc2;transform:rotateY(180deg);color:var(--soft);font-size:calc(var(--bh)*.14)}
.hl{width:calc(var(--bh)*.46);height:auto;overflow:visible;margin-top:calc(var(--bh)*.01)}
.hl .shackle{transition:transform .55s cubic-bezier(.3,1.4,.5,1);transform-origin:32px 52px}
.pd{fill:none;stroke:#7a4a0f;stroke-width:1.8;transition:fill .08s}
.pd.f{fill:#7a4a0f}
.pinov.unl .shackle{transform:translate(-2px,-8px) rotate(-30deg)}
.pinov.unl .hl{animation:pop .5s}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.14)}100%{transform:scale(1)}}
.hl.shake{animation:shk .35s}
@keyframes shk{20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.ctrl{display:flex;flex-direction:column;align-items:center;gap:4px;transition:opacity .35s}
.pinov.unl .ctrl{opacity:0;pointer-events:none}
.ctrl h2{margin:0;font-size:clamp(18px,3.2vh,24px)}
.ctrl .sub{margin:0;font-size:clamp(13px,2.2vh,16px)}
.ctrl .err{color:#c2185b;min-height:20px;font-size:14px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(5px,1.3vh,12px);width:min(290px,78vw);direction:ltr}
.pad button{height:clamp(40px,7.4vh,62px);border-radius:999px;background:#fff;border:2px solid var(--line);color:var(--ink);font-size:clamp(20px,3.4vh,26px);font-weight:700;padding:0}
.pad button:active{background:#ffe3ee}
.pad button:disabled{opacity:.4}
.pad .nb{visibility:hidden}
.ctrl .lnk{background:none;color:var(--soft);font-size:14px;text-decoration:underline;font-weight:500;padding:2px 8px}
@media (min-aspect-ratio:5/4){.pinov{flex-direction:row;gap:6vw}.book{--bh:min(76vh,430px)}.pad button{height:clamp(40px,10vh,62px)}}
@media (prefers-reduced-motion:reduce){.book,.lid,.hl .shackle,.pinov{transition-duration:.01s}.pinov.unl .hl{animation:none}}
/* ===== غلاف 3D v2 ===== */
.pinov{background:radial-gradient(ellipse at 50% 28%,#2b4170 0,#122244 55%,#070f24 100%)}
.stage{animation:fl 5s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-8px)}}
.book{filter:drop-shadow(0 22px 22px #000a)}
.book .pg{background:linear-gradient(90deg,#efe2c8,#fffaf0 14%,#fff7e8);border:0;color:#5a3f1a;box-shadow:-1px 1px 0 #e6d8bc,-2px 2px 0 #fffaf0,-3px 3px 0 #e6d8bc,-4px 4px 0 #fffaf0,-5px 5px 0 #e6d8bc,-6px 6px 0 #fffaf0,-7px 7px 0 #e6d8bc,-8px 8px 0 #fffaf0,-9px 9px 0 #e6d8bc,-10px 10px 0 #1a2f5a,-11px 11px 0 #14264b,-12px 12px 0 #0f1e3d,-13px 13px 0 #0a1630}
.book .pg .big{color:#a8691a}
.book .pg .dt,.book .pg .ln{color:#8a6a3a}
.fr{background:radial-gradient(circle at 30% 18%,#34559a,#17294f 55%,#0b1631);border:0;color:#f6d98a;box-shadow:inset -14px 0 16px #0009,inset 3px 0 5px #ffffff30,inset 0 2px 3px #ffffff30}
.fr::before{content:"";position:absolute;inset:12px 22px 12px 12px;border:2px solid #d9a93a;border-radius:3px 10px 10px 3px;opacity:.8;pointer-events:none}
.fr .t{background:linear-gradient(180deg,#fff0b8,#e0a02b 60%,#9a6414);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;filter:drop-shadow(0 2px 2px #000a)}
.fr .h{color:#d9b878}
.bk{background:linear-gradient(90deg,#0f1e3d,#1b2f57);border:0;color:#d9a93a}
.hl{filter:drop-shadow(0 5px 4px #000b)}
.ctrl h2{color:#fbeacb}.ctrl .sub,.ctrl .lnk{color:#aebbd8}.ctrl .err{color:#ff9aa8}
.pad button{background:linear-gradient(180deg,#3d5d9c,#223a6c);border:0;color:#fbeacb;box-shadow:0 5px 0 #0a1630,0 9px 14px #0008,inset 0 1px 0 #ffffff40;transition:transform .08s,box-shadow .08s}
.pad button:active{background:linear-gradient(180deg,#34528c,#1b3160);transform:translateY(4px);box-shadow:0 1px 0 #0a1630,0 3px 6px #0008,inset 0 1px 0 #ffffff30}
@media (min-aspect-ratio:5/4){.pinov{gap:clamp(40px,7vw,90px)}}
@media (prefers-reduced-motion:reduce){.stage{animation:none}}
.pd{stroke:#f6d98a}.pd.f{fill:#f6d98a}
.hl{width:calc(var(--bh)*.36)}
.fr{gap:calc(var(--bh)*.035)}
/* ===== v3 سينمائي ===== */
.pinov.zoom{overflow:hidden}
.pinov::after{content:"";position:absolute;inset:0;z-index:5;background:radial-gradient(circle,#fffaf0,#ffe9b8);opacity:0;transition:opacity 1.2s ease;pointer-events:none}
.pinov.zoom::after{opacity:1}
.stage{position:relative;animation:fl 6s ease-in-out infinite}
.stage::after{content:"";position:absolute;left:8%;right:-6%;bottom:-34px;height:26px;background:radial-gradient(ellipse,#000b,transparent 70%);filter:blur(4px);z-index:-1}
.pinov.zoom .stage{animation:none;transform:scale(3.6);transition:transform 1.5s cubic-bezier(.65,0,.25,1)}
.book{filter:none;transform:rotateX(7deg) rotateY(-13deg)}
.pinov.open .book{transform:rotateX(5deg) rotateY(-6deg) translateX(-14%)}
.book .pg{transform:translateZ(-3px)}
.sheet{position:absolute;inset:3px 3px 3px 6px;background:linear-gradient(90deg,#f1e4c9,#fffaf0);border-radius:4px 14px 14px 4px;transform:translateZ(-1px);transform-origin:right center}
.pinov.open .sheet{animation:brz 2.4s ease-in-out infinite alternate}
@keyframes brz{from{transform:translateZ(-1px) rotateY(-5deg)}to{transform:translateZ(-1px) rotateY(-16deg) skewY(.6deg)}}
.glow{position:absolute;inset:-18%;border-radius:50%;background:radial-gradient(circle,#ffe9a8cc,#ffc94a44 45%,transparent 70%);opacity:0;transition:opacity 1.2s;pointer-events:none}
.pinov.open .glow{opacity:1}
.pinov.rec .ctrl{pointer-events:none}
.pd{stroke:#a98a4a;opacity:.75;transition:fill .25s,stroke .25s,filter .25s,opacity .25s}
.pd.f,.pinov.rec .pd{fill:#ffd66b;stroke:#fff0b0;opacity:1;filter:drop-shadow(0 0 3px #ffc94a)}
.pinov.rec .hl,.pinov.unl .hl{filter:drop-shadow(0 0 14px #ffd05a)}
.kh{transition:fill .6s,filter .6s}
.pinov.unl .kh{fill:#fff2b0;filter:drop-shadow(0 0 5px #ffd05a)}
.pad button.pr{animation:spr .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes spr{0%{transform:translateY(5px);box-shadow:0 0 0 #0a1630,0 0 18px #ffd05a}55%{transform:translateY(-2px)}100%{transform:none}}
.hl.nudge{animation:nd .3s}
@keyframes nd{40%{transform:translateY(2px) rotate(-2deg)}100%{transform:none}}
.book.bump{animation:bp .3s}
@keyframes bp{40%{transform:rotateX(7deg) rotateY(-13.6deg) scale(.994)}}
.book.wob{animation:wb .45s}
@keyframes wb{20%{transform:rotateX(7deg) rotateY(-9deg)}40%{transform:rotateX(7deg) rotateY(-16deg)}60%{transform:rotateX(7deg) rotateY(-11deg)}80%{transform:rotateX(7deg) rotateY(-14.5deg)}}
.sp{position:fixed;width:6px;height:6px;margin:-3px;border-radius:50%;background:#ffd66b;box-shadow:0 0 8px #ffc84a;pointer-events:none;z-index:4;animation:spk .7s ease-out forwards}
@keyframes spk{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.orb{position:fixed;left:0;top:0;width:18px;height:18px;border-radius:50%;background:radial-gradient(#fff6c8,#ffc94a 60%,transparent 70%);box-shadow:0 0 18px 8px #ffc94a88;pointer-events:none;z-index:4}
.snd{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:12px;z-index:6;width:40px;height:40px;border-radius:50%;padding:0;background:#ffffff18;border:1px solid #ffffff30;font-size:18px;transition:opacity .3s}
.pinov.rec .snd{opacity:0}
@media (prefers-reduced-motion:reduce){.stage,.pinov.open .sheet{animation:none}.pad button.pr,.hl.nudge,.book.bump,.book.wob,.sp{animation:none}.pinov.zoom .stage{transition-duration:.01s}}
</style>
</head>
<body>

<div id="setup" class="scr">
 <div class="deco">🌸 💗 ✨</div><h1>الإعداد</h1>
 <p class="sub">دخل المعلومات العامة ديال Supabase (Project URL و publishable key). المرة الأولى غير.</p>
 <div class="card"><input id="su" type="text" placeholder="Project URL" dir="ltr"><div style="height:8px"></div><input id="sk" type="text" placeholder="Publishable key" dir="ltr">
 <div class="row"><button onclick="saveSetup()">حفظ</button></div></div>
</div>

<div id="login" class="scr">
 <div class="deco">🌸 💗 ✨</div><h1>كتابنا ♡</h1><p class="sub">غير حسابين مسموح ليهم</p>
 <div class="card"><input id="le" type="email" placeholder="الإيميل" dir="ltr"><div style="height:8px"></div><input id="lp" type="password" placeholder="كلمة السر" dir="ltr">
 <div class="err" id="lerr"></div><div class="row"><button onclick="login()">دخول 💕</button></div></div>
</div>

<div id="app" class="scr">
 <div class="top"><button onclick="openMsgs()" aria-label="الرسائل">💬</button><div class="deco" style="margin:0">🌸 💗 ✨</div><button onclick="logout()" aria-label="خروج">🚪</button></div>
 <div class="card cnt" id="cnt"></div>
 <div id="main"></div>
 <div class="nav" id="nav"></div>
</div>



<div class="pinov" id="pin" hidden role="dialog" aria-label="كتابنا، دخل الكود">
 <button class="snd" id="snd" onclick="sndToggle()" aria-label="الصوت">🔊</button>
 <div class="stage"><div class="glow"></div><div class="book">
  <div class="pg"><div class="fl">🌸 💗 🌸</div><div class="dt">اليوم</div><div class="big" id="cvDay"></div><div class="dt" id="cvDate"></div><div class="ln">كل نهار صفحة جديدة فكتابنا ♡</div></div>
  <div class="sheet"></div>
  <div class="lid">
   <div class="face fr"><div class="f">🌷 🌸 🌷</div><div class="t">كتابنا ♡</div>
    <svg class="hl" id="hl" viewBox="0 0 100 112" aria-hidden="true">
     <defs>
      <linearGradient id="gb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffeb9c"/><stop offset=".4" stop-color="#e8b23a"/><stop offset="1" stop-color="#9c6212"/></linearGradient>
      <linearGradient id="gs" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f4f7fc"/><stop offset=".5" stop-color="#9aa6b8"/><stop offset="1" stop-color="#5d6a80"/></linearGradient>
     </defs>
     <g class="shackle"><path d="M32 56V34a18 18 0 0 1 36 0V56" fill="none" stroke="#3b4658" stroke-width="10" stroke-linecap="round"/><path d="M32 56V34a18 18 0 0 1 36 0V56" fill="none" stroke="url(#gs)" stroke-width="7" stroke-linecap="round"/></g>
     <rect x="8" y="50" width="84" height="58" rx="14" fill="#6e430c"/>
     <rect x="8" y="48" width="84" height="57" rx="14" fill="url(#gb)" stroke="#8a5510" stroke-width="1.5"/>
     <rect x="13" y="51" width="74" height="9" rx="4.5" fill="#fff" opacity=".35"/>
     <path class="kh" d="M50 78C40 70 35 63 40.500 59c4-2.500 7 0 9.500 3 2.500-3 5.500-5.500 9.500-3C65 63 60 70 50 78Z" fill="#7a4a0f" opacity=".85"/>
     <rect x="18" y="80" width="64" height="17" rx="8.500" fill="#4a2e07" stroke="#2f1c04" stroke-width="1.5"/>
     <circle class="pd" cx="26.5" cy="88" r="3.4"/><circle class="pd" cx="35.9" cy="88" r="3.4"/><circle class="pd" cx="45.3" cy="88" r="3.4"/><circle class="pd" cx="54.7" cy="88" r="3.4"/><circle class="pd" cx="64.1" cy="88" r="3.4"/><circle class="pd" cx="73.5" cy="88" r="3.4"/>
    </svg>
    <div class="h">غير حنا الجوج</div></div>
   <div class="face bk">♡</div>
  </div>
 </div></div>
 <div class="ctrl">
  <h2 id="pinT"></h2><p class="sub" id="pinS"></p>
  <div class="err" id="pinE"></div>
  <div class="pad" id="pinP"></div>
  <button class="lnk" id="pinF" onclick="pinForgot()">نسيت الكود؟</button>
 </div>
</div>

<div class="ov" id="ov">
 <div class="bar"><h2 style="margin:0">الرسائل 💬</h2><button class="ghost" onclick="closeMsgs()">رجع</button></div>
 <div id="ml"></div>
 <div id="mf"><input id="mi" type="text" placeholder="كتب شي حاجة…" style="flex:1"><button onclick="sendMsg()">صيفط</button></div>
</div>

<script>
const SPACE='1449f144-7e6a-40fc-b9d6-08962201d5e2', BUCKET='our-files';
const START=new Date(2026,9,10,12);          // النهار 1 = 10 أكتوبر 2026
const START_TS=new Date(2026,9,10,23,46,0);  // أول رسالة بيناتنا
const QS=['شنو كنكون فالحياة ديالك؟','شنو أول حاجة لاحظتي فيا؟','شنو أكثر حاجة كتعجبك فيا؟','شنو الحاجة اللي بغيتي مني نديرها؟','لو كانت عندك قوة خارقة، شنو تكون؟','شنو الأحلام ديالك الصغار والكبار؟','فين بغيتي نسافرو بجوج؟','شنو أصعب حاجة عشتيها وتجاوزتيها؟','شنو الحاجة اللي كتفرحك فالنهار؟','شنو أحسن لحظة عشناها بجوج؟','كيفاش كتشوفي المستقبل ديالنا؟','شنو الحاجة اللي كتخليك تضحك ديما؟','شنو الحاجة اللي كتحسها فيك مختلفة على الناس؟','شنو الأكلة اللي كتفكرك فينا؟','شنو الحاجة اللي بغيتي تقولها وما قلتيهاش؟','شنو الأغنية اللي كتشبهنا؟','شنو الحاجة اللي تبغي تحلم بيها الليلة؟','شنو الحاجة اللي بدلات فيك من نهار عرفتينا؟','شنو الهدف اللي بغيتي تحققو هاد الشهر؟','شنو الكلمة اللي بغيتي تسمعها مني اليوم؟'];
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const dayDate=n=>{const d=new Date(START);d.setDate(d.getDate()+n-1);return d};
const todayN=()=>{const t=new Date();t.setHours(12,0,0,0);return Math.max(1,Math.round((t-START)/864e5)+1)};
const fmt=d=>d.toLocaleDateString('ar-MA',{weekday:'long',day:'numeric',month:'long'});

function ac(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}return AC}
function tone(f,t,d,v,type,f2){const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain(),n=a.currentTime+t;o.type=type||'sine';o.frequency.setValueAtTime(f,n);if(f2)o.frequency.exponentialRampToValueAtTime(f2,n+d);g.gain.setValueAtTime(.0001,n);g.gain.linearRampToValueAtTime(v,n+.01);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g).connect(a.destination);o.start(n);o.stop(n+d+.05)}
function noise(t,d,v,fr){const a=ac();if(!a)return;const n=a.currentTime+t,len=Math.floor(a.sampleRate*d),b=a.createBuffer(1,len,a.sampleRate),x=b.getChannelData(0);for(let i=0;i<len;i++)x[i]=(Math.random()*2-1)*(1-i/len);const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=b;f.type='bandpass';f.frequency.value=fr;g.gain.value=v;s.connect(f).connect(g).connect(a.destination);s.start(n)}
function sfx(k){if(!snd)return;

async function pinKey(k){
  if(pinBusy||pinLockLeft()>0||$('#pin').classList.contains('rec'))return;
  if(k==='b'){pinBuf=pinBuf.slice(0,-1);pinMsg('');return pinRender()}
  if(pinBuf.length>=PIN_LEN)return;
  pinBuf+=k;pinRender();
  if(pinBuf.length<PIN_LEN)return;
  const v=pinBuf;pinBusy=true;
  try{
    if(pinMode==='setup1'){pinFirst=v;pinBuf='';pinMode='setup2';pinTexts();pinRender();return}
    if(pinMode==='setup2'){
      if(v!==pinFirst){pinMode='setup1';pinBuf='';pinFirst='';pinTexts();pinRender();pinShake();pinMsg('ما تطابقاش، عاود من الأول');return}
      const salt=crypto.getRandomValues(new Uint8Array(16)),it=150000;
      const hh=await pinHash(v,salt,it);
      localStorage.setItem('kpin',JSON.stringify({s:b64(salt),h:b64(hh),i:it}));
      localStorage.removeItem('kpinfail');localStorage.removeItem('kpinlock');
      return pinOk();
    }
    const st=pinStored();
    if(!st)return pinForgot(true);
    const hh=await pinHash(v,unb64(st.s),st.i);
    if(sameBytes(hh,unb64(st.h))){localStorage.removeItem('kpinfail');localStorage.removeItem('kpinlock');return pinOk()}

    if(f>=5)localStorage.setItem('kpinlock',Date.now()+30000*Math.pow(2,f-5));
    pinMsg('حاول مرة أخرى ❤️');pinTick();
  }finally{pinBusy=false}
}

    const file=pf.files[0];if(!file)return;pm.textContent='كنرفع الصورة…';
    const small=await shrink(file),isJ=small!==file;
    const path=SPACE+'/photos/'+me.id+'/'+day+'-'+Date.now()+'.'+(isJ?'jpg':((file.name.split('.').pop()||'jpg').toLowerCase()));
    const u=await sb.storage.from(BUCKET).upload(path,small,{contentType:isJ?'image/jpeg':file.type});
    if(u.error){pm.textContent='ما تحمّلاتش: '+u.error.message;return}
    const old=mine.photo_path;mine.photo_path=path;setPhoto(path);await save();pm.textContent='';
    if(old)sb.storage.from(BUCKET).remove([old]);
    pf.value='';
  };
  const spB=h('button',{class:'ghost'});
  const paintSp=()=>{spB.textContent=special?'💎 ذكرى خاصة'+(special.title?': '+special.title:''):'◇ علّم هاد النهار ذكرى خاصة'};
  paintSp();
  spB.onclick=async()=>{
    msg.textContent='';
    if(special){
      if(special.created_by!==me.id){msg.textContent='الطرف الآخر هو لي علّمها.';return}
      if(!confirm('تحيد العلامة؟'))return;
      const r=await sb.from('special_days').delete().eq('id',special.id);
      if(r.error){msg.textContent=r.error.message;return}
      special=null;paintSp();return;
    }
    const t=prompt('شنو وقع فهاد النهار؟ (عنوان قصير)');if(t===null)return;
    const r=await sb.from('special_days').insert({space_id:SPACE,day,title:t.trim(),created_by:me.id}).select().single();
    if(r.error){msg.textContent='ما تحفظاتش: '+r.error.message;return}
    special=r.data;paintSp();
  };
  box.append(h('div',{class:'card'},h('b',{class:'t'},'أنا 💗'),ta,player,h('div',{class:'row'},rb,starB,st),msg));
  box.append(h('div',{class:'card'},h('b',{class:'t'},'📸 صورة النهار'),pBox,h('div',{class:'row'},h('button',{onclick:()=>pf.click()},'صورة النهار 📷'),pf),pm,h('div',{class:'row'},spB)));

  if(other){
    const c=h('div',{class:'card sun'},h('b',{class:'t'},'هو/هي 💌'+(other.starred?' ⭐':'')),h('div',{style:'white-space:pre-wrap'},other.content||'…'));
    if(other.audio_path)c.append(audioEl(other.audio_path));
    if(other.photo_path){const im=h('img',{class:'pic'});signed(other.photo_path).then(u=>im.src=u);c.append(im)}
    box.append(c);
  }else box.append(h('div',{class:'card sun'},'📜 الطرف الآخر مزال ما كتب فهاد النهار.'));
  return box;
}

async function daysPage(){
  const {data,error}=await sb.from('day_entries').select('day,content,audio_path,photo_path').eq('space_id',SPACE);
  if(error)throw error;
  const has=new Set((data||[]).filter(r=>(r.content&&r.content.trim())||r.audio_path||r.photo_path).map(r=>r.day));
  const {data:sdd}=await sb.from('special_days').select('day').eq('space_id',SPACE);
  const spec=new Set((sdd||[]).map(r=>r.day));
  const {data:cd}=await sb.from('chat_snippets').select('day');
  (cd||[]).forEach(r=>has.add(r.day));
  const box=h('div',{},h('h1',{},'الأيام 📅'),h('p',{class:'sub'},'كل نهار دارو بجوج 💕'));
  const t=todayN();
  box.append(h('button',{class:'ghost',onclick:()=>{const e=$('.item.today');if(e)e.scrollIntoView({behavior:'smooth',block:'center'})}},'↓ نمشي لليوم'));
  for(let n=1;n<=t;n++){
    const d=dayDate(n),full=has.has(iso(d));
    box.append(h('div',{class:'card item'+(n===t?' today':''),onclick:()=>go('days',n)},
      h('div',{class:'dot'},String(n)),
      h('div',{},h('b',{},'النهار '+n),h('div',{class:'d'},fmt(d))),
      h('div',{style:'margin-inline-start:auto'},(spec.has(iso(d))?'💎 ':'')+(n===t?'اليوم':(full?'📜':'خاوي')))));
  }
  box.append(h('div',{class:'row',style:'justify-content:center;margin-top:18px'},h('button',{class:'ghost',onclick:importFile},'📥 استيراد ملف الشات')));
  return box;
}

async function zwinPage(){
  const {data,error}=await sb.from('day_entries').select('*').eq('space_id',SPACE).eq('starred',true).order('day',{ascending:false});
  if(error)throw error;
  const box=h('div',{},h('h1',{},'كلام زوين 💌'),h('p',{class:'sub'},'اللي يعجبو يبقى محفوظ 🔒'));
  if(!data.length)box.append(h('div',{class:'card'},'ما كاين والو بعد. ضغط على ⭐ فأي كتابة ولا أوديو باش يبان هنا.'));
  data.forEach(r=>{
    const n=Math.round((new Date(r.day+'T12:00:00')-START)/864e5)+1;
    const c=h('div',{class:'card'},h('b',{class:'t'},'النهار '+n+(r.author_id===me.id?' · أنا':' · هو/هي')),h('div',{style:'white-space:pre-wrap'},r.content||''));
    if(r.audio_path)c.append(audioEl(r.audio_path));
    box.append(c);
  });
  const {data:sd}=await sb.from('special_days').select('*').eq('space_id',SPACE).order('day',{ascending:false});
  if(sd&&sd.length){
    box.append(h('h2',{style:'margin-top:20px'},'💎 ذكريات خاصة'));
    sd.forEach(r=>{
      const n=Math.round((new Date(r.day+'T12:00:00')-START)/864e5)+1;
      box.append(h('div',{class:'card item',onclick:()=>go('days',n)},h('div',{class:'dot'},String(n)),h('div',{},h('b',{},r.title||'ذكرى خاصة'),h('div',{class:'d'},fmt(new Date(r.day+'T12:00:00'))))));
    });
  }
  const lb=await lettersBox();
  if(lb){lb.style.marginTop='20px';box.append(lb)}
  return box;
}

async function picsPage(){
  const {data,error}=await sb.from('photos').select('*').eq('space_id',SPACE).order('created_at',{ascending:false});
  if(error)throw error;
  const box=h('div',{},h('h1',{},'تصاور 📸'),h('p',{class:'sub'},'لحظاتنا'));
  const f=h('input',{type:'file',accept:'image/*',multiple:'',style:'display:none'});
  const msg=h('div',{class:'err'});
  f.onchange=async()=>{
    let i=0;
    for(const file of f.files){
      msg.textContent='كنرفع '+(++i)+'/'+f.files.length+'…';
      const small=await shrink(file),isJ=small!==file;
      const ext=isJ?'jpg':(file.name.split('.').pop()||'jpg').toLowerCase();
      const path=SPACE+'/photos/'+me.id+'/'+Date.now()+'-'+i+'.'+ext;
      const u=await sb.storage.from(BUCKET).upload(path,small,{contentType:isJ?'image/jpeg':file.type});
      if(u.error){msg.textContent='ما تحمّلاتش: '+u.error.message;return}
      const r=await sb.from('photos').insert({space_id:SPACE,path});
      if(r.error){msg.textContent='ما تسجّلاتش: '+r.error.message;return}
    }
    render();
  };
  box.append(h('div',{class:'row'},h('button',{onclick:()=>f.click()},'زيد صورة 📷'),f),msg);
  if(!data.length){box.append(h('div',{class:'card'},'ما كاين حتى صورة. زيد أول لحظة ✨'));return box}
  const {data:urls}=await sb.storage.from(BUCKET).createSignedUrls(data.map(p=>p.path),3600);
  const g=h('div',{class:'grid'});
  data.forEach((p,i)=>{
    const d=h('div',{},h('img',{src:(urls&&urls[i]&&urls[i].signedUrl)||'',loading:'lazy'}));
    if(p.author_id===me.id)d.append(h('button',{class:'x',onclick:async()=>{
      if(!confirm('تمسح هاد الصورة؟'))return;
      await sb.storage.from(BUCKET).remove([p.path]);
      await sb.from('photos').delete().eq('id',p.id);render();
    }},'🗑'));
    g.append(d);
  });
  box.append(g);return box;
}

async function questionPage(){
  const n=todayN(),day=iso(dayDate(n));
  const {data,error}=await sb.from('question_answers').select('*').eq('space_id',SPACE).eq('day',day);
  if(error)throw error;
  const mine=(data||[]).find(r=>r.author_id===me.id),other=(data||[]).find(r=>r.author_id!==me.id);
  const box=h('div',{},h('h1',{},'سؤال النهار ✨'),h('p',{class:'sub'},'النهار '+n));
  box.append(h('div',{class:'card sun'},h('b',{},QS[(n-1)%QS.length])));
  const ta=h('textarea',{placeholder:'جاوب هنا…'});ta.value=mine?mine.answer||'':'';
  const st=h('span',{class:'st'},'');
  const b=h('button',{},'حفظ الجواب 💾');
  b.onclick=async()=>{
    const {error}=await sb.from('question_answers').upsert({space_id:SPACE,day,author_id:me.id,answer:ta.value},{onConflict:'space_id,day,author_id'});
    if(error)st.textContent='ما تحفظش: '+error.message;else render();
  };
  box.append(h('div',{class:'card'},h('b',{class:'t'},'أنا 💗'),ta,h('div',{class:'row'},b,st)));
  let oc;
  if(!other)oc='مزال ما جاوب… 🥺💗';
  else if(!mine)oc='جاوب، خاصك تجاوب نتا حتى ترى جوابو 🔒';
  else oc=other.answer||'…';
  box.append(h('div',{class:'card sun'},h('b',{class:'t'},'هو/هي 💌'),h('div',{style:'white-space:pre-wrap'},oc)));
  return box;
}

let gsub='q',nsub='dream';
const myWho=()=>((me.email||'').toLowerCase().startsWith('adil')?'adil':'her');
async function gamePage(){
  const box=h('div'),seg=h('div',{class:'row',style:'justify-content:center;margin:0 0 6px'});
  [['q','🎲 سؤال النهار'],['n','🌠 أحلامنا وأهدافنا']].forEach(([k,t])=>seg.append(h('button',{class:gsub===k?'':'ghost',onclick:()=>{gsub=k;render()}},t)));
  box.append(seg,gsub==='q'?await questionPage():await notesPage());
  return box;
}
async function notesPage(){
  const box=h('div'),chips=h('div',{class:'row',style:'justify-content:center'});
  const T={dream:'أحلام 🌠',goal:'أهداف 🎯',answer:'أجوبة 💬'};
  Object.entries(T).forEach(([k,t])=>chips.append(h('button',{class:nsub===k?'':'ghost',onclick:()=>{nsub=k;render()}},t)));
  box.append(h('h1',{},'أحلامنا وأهدافنا'),h('p',{class:'sub'},nsub==='answer'?'أجوبة دوينا عليها من قبل':nsub==='dream'?'الحلم كيبقى حلم، والأهداف كنخدمو عليها 💪':'الحوايج اللي غنخدمو عليها 🎯'),chips);
  const {data,error}=await sb.from('our_notes').select('*').eq('space_id',SPACE).eq('kind',nsub).order('created_at',{ascending:true});
  if(error)throw error;
  const label=w=>w===myWho()?'أنا '+(w==='adil'?'💙':'💗'):(w==='adil'?'عادل 💙':'الحبيبة 💗');
  if(!data.length)box.append(h('div',{class:'card'},'مزال ما كاين والو هنا. زيد أول وحدة ✨'));
  data.forEach(r=>{
    const c=h('div',{class:'card'},h('b',{class:'t'},label(r.who)),h('div',{style:'white-space:pre-wrap'},r.content));
    if(r.author_id===me.id)c.append(h('div',{class:'row'},h('button',{class:'ghost',onclick:async()=>{if(confirm('تمسح هادي؟')){await sb.from('our_notes').delete().eq('id',r.id);render()}}},'🗑')));
    box.append(c);
  });
  const ta=h('textarea',{placeholder:'زيد وحدة جديدة…',style:'min-height:70px'});
  box.append(h('div',{class:'card sun'},ta,h('div',{class:'row'},h('button',{onclick:async()=>{
    const v=ta.value.trim();if(!v)return;
    const {error}=await sb.from('our_notes').insert({space_id:SPACE,kind:nsub,who:myWho(),content:v});
    if(error)alert(error.message);else render();
  }},'زيد 💾'))));
  return box;
}
function importFile(){
  const f=h('input',{type:'file',accept:'.json,application/json'});
  f.onchange=async()=>{
    try{
      const j=JSON.parse(await f.files[0].text());
      const sn=(j.snippets||[]).map(r=>({space_id:SPACE,day:r.day,line_no:r.line_no,content:r.content}));
      const nt=(j.notes||[]).map(r=>({space_id:SPACE,kind:r.kind,who:r.who,content:r.content,import_key:r.import_key}));
      let e1=null,e2=null;
      if(sn.length)e1=(await sb.from('chat_snippets').upsert(sn,{onConflict:'space_id,day,line_no'})).error;
      if(nt.length)e2=(await sb.from('our_notes').upsert(nt,{onConflict:'space_id,import_key'})).error;
      const e=e1||e2;
      alert(e?'وقع مشكل: '+e.message:'تم الاستيراد ✓  '+sn.length+' جملة و '+nt.length+' ملاحظة');
      render();
    }catch(e){alert('الملف ماشي صحيح: '+e.message)}
  };
  f.click();
}

async function loadMsgs(){
  const {data}=await sb.from('messages').select('*').eq('space_id',SPACE).order('created_at',{ascending:true}).limit(300);
  const l=$('#ml'),stick=l.scrollTop+l.clientHeight>=l.scrollHeight-60;
  l.replaceChildren(...(data||[]).map(m=>h('div',{class:'b '+(m.created_by===me.id?'me':'ot')},m.content)));
  if(stick)l.scrollTop=l.scrollHeight;
}
function openMsgs(){history.pushState({k:'ov'},'');$('#ov').classList.add('on');loadMsgs().then(()=>{$('#ml').scrollTop=1e9});poll=setInterval(loadMsgs,5000)}
function closeMsgs(fp){if(!fp&&history.state&&history.state.k==='ov'){history.back();return}$('#ov').classList.remove('on');clearInterval(poll)}
addEventListener('popstate',e=>{
  if(!$('#app').classList.contains('on'))return;
  if($('#ov').classList.contains('on')){closeMsgs(true);return}
  if(!$('#pin').hidden)return;
  const s=e.state;
  if(s&&s.k==='nav')go(s.tab,s.day,true);else go('today',null,true);
});
async function sendMsg(){
  const v=$('#mi').value.trim();if(!v)return;
  const {error}=await sb.from('messages').insert({space_id:SPACE,created_by:me.id,content:v});
  if(!error){$('#mi').value='';await loadMsgs();$('#ml').scrollTop=1e9}
}
boot();
</script>
